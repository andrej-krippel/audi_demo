<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audi Chat</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: url("images/background.png") center / cover no-repeat;
    }
  </style>
</head>
<body>
  <script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
  <script>
    addEventListener("load", () => {
      if (typeof window.initWebRTCWidget !== "function") {
        console.error("Cognigy Click To Call script did not load.");
        return;
      }

      window.initWebRTCWidget(
        "https://endpoint-trial.cognigy.ai/f5f671258043f8777480a87732e3824bb0aefea43fbfe6c62f43aed79befa952"
      ).catch((error) => {
        console.error("Could not initialize Cognigy Click To Call:", error);
      });
    });
  </script>
</body>
</html>
